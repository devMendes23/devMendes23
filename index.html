<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="calculator" role="application" aria-label="Calculadora">
        <div class="screen">
            <div class="expression" id="expression" aria-hidden="true"></div>
            <input
                type="text"
                id="display"
                class="display"
                value="0"
                readonly
                aria-live="polite"
                aria-label="Resultado"
            >
        </div>

        <div class="buttons">
            <button class="button action" data-action="clear">C</button>
            <button class="button action" data-action="sign">±</button>
            <button class="button action" data-action="percent">%</button>
            <button class="button operator" data-operator="/">÷</button>

            <button class="button" data-number="7">7</button>
            <button class="button" data-number="8">8</button>
            <button class="button" data-number="9">9</button>
            <button class="button operator" data-operator="*">×</button>

            <button class="button" data-number="4">4</button>
            <button class="button" data-number="5">5</button>
            <button class="button" data-number="6">6</button>
            <button class="button operator" data-operator="-">−</button>

            <button class="button" data-number="1">1</button>
            <button class="button" data-number="2">2</button>
            <button class="button" data-number="3">3</button>
            <button class="button operator" data-operator="+">+</button>

            <button class="button zero" data-number="0">0</button>
            <button class="button" data-action="decimal">.</button>
            <button class="button action" data-action="backspace" aria-label="Apagar">⌫</button>
            <button class="button equal" data-action="equals">=</button>
        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
