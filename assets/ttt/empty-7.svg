<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100" viewBox="0 0 100 100">
<defs><filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="2.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>
<style>
  .draw { stroke-dasharray: 100; stroke-dashoffset: 100; animation: draw .55s ease-out forwards; }
  .d2 { animation-delay: .25s; }
  .glowing { animation: ring 1.8s ease-in-out infinite; }
  .invite { animation: invite 2.6s ease-in-out infinite; }
  @keyframes draw { to { stroke-dashoffset: 0; } }
  @keyframes ring { 0%, 100% { stroke-opacity: .35; } 50% { stroke-opacity: 1; } }
  @keyframes invite { 0%, 100% { stroke-opacity: .25; } 50% { stroke-opacity: .7; } }
  @media (prefers-reduced-motion: reduce) { * { animation-duration: .01s !important; animation-delay: 0s !important; animation-iteration-count: 1 !important; } }
  .invite { animation-delay: -2.03s; }
</style>
<rect x="5" y="5" width="90" height="90" rx="18" fill="#0D1117"/>
<rect x="5" y="5" width="90" height="90" rx="18" fill="none" stroke="#30363D" stroke-width="2.5"/>
<rect class="invite" x="5" y="5" width="90" height="90" rx="18" fill="none" stroke="#A855F7" stroke-width="2.5"/><text x="50" y="60" text-anchor="middle" font-family="'JetBrains Mono', 'Fira Code', 'Cascadia Code', Consolas, 'Courier New', monospace" font-size="28" fill="#8B949E" fill-opacity=".7">7</text>
</svg>
