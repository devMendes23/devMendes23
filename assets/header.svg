<style>
  .sans { font-family: 'Segoe UI', Inter, 'Helvetica Neue', Arial, sans-serif; }
  .mono { font-family: 'JetBrains Mono', 'Fira Code', 'Cascadia Code', Consolas, 'Courier New', monospace; }
  .tag { font-size: 13px; fill: #8B949E; }
  .rise { opacity: 0; animation: rise .9s cubic-bezier(.2,.7,.2,1) forwards; }
  .pulse { animation: pulse 2.4s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
  .float { animation: float 9s ease-in-out infinite; }
  .grow { transform-box: fill-box; transform-origin: left; transform: scaleX(0); animation: grow 1.1s .9s cubic-bezier(.2,.7,.2,1) forwards; }
  @keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
  @keyframes pulse { 0%, 100% { transform: scale(.7); opacity: .55; } 50% { transform: scale(1.25); opacity: 1; } }
  @keyframes float { 0%, 100% { transform: translate(0, 0); } 50% { transform: translate(-30px, 18px); } }
  @keyframes grow { to { transform: scaleX(1); } }
  @media (prefers-reduced-motion: reduce) { * { animation-duration: .01s !important; animation-delay: 0s !important; animation-iteration-count: 1 !important; } }
</style>
